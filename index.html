
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic.AI - Simple Astrology</title>
    <meta name="description" content="AI-powered astrology readings." />
    <meta name="theme-color" content="#0f0c29" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Cinzel', 'serif'],
              poppins: ['Poppins', 'sans-serif'],
            },
            colors: {
              cosmic: {
                900: '#0f0c29',
                800: '#302b63',
                700: '#24243e',
                gold: '#ffd700',
              }
            },
            backgroundImage: {
              'nebula': 'linear-gradient(to right, #0f0c29, #302b63, #24243e)',
              'holo': 'linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 100%)',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.05);
        --glass-shadow: rgba(0, 0, 0, 0.1);
        --text-main: #1e293b;
      }
      
      html.dark {
        --glass-bg: rgba(15, 12, 41, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-shadow: rgba(0, 0, 0, 0.37);
        --text-main: #e2e8f0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        color: var(--text-main);
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      html.dark body {
        background-color: #0f0c29;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cinzel', serif;
      }
      
      /* Optimized Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      html.dark ::-webkit-scrollbar-thumb { background: #302b63; }

      /* Glassmorphism - Simplified for performance */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px); /* Lower blur for performance */
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }
      
      .glass-card-premium {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
      }

      html.dark .glass-card-premium {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glass-card-premium:hover {
        transform: translateY(-2px);
      }

      /* Simplified Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      @keyframes shimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 4s linear infinite;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
      }

      /* Orbital Animations - GPU Optimized */
      @keyframes spin-orbit {
        from { transform: rotate(0deg) translate3d(0,0,0); }
        to { transform: rotate(360deg) translate3d(0,0,0); }
      }
      @keyframes spin-orbit-reverse {
        from { transform: rotate(360deg) translate3d(0,0,0); }
        to { transform: rotate(0deg) translate3d(0,0,0); }
      }
      .animate-orbit {
        animation: spin-orbit var(--duration, 20s) linear infinite;
        will-change: transform;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      .animate-orbit-reverse {
        animation: spin-orbit-reverse var(--duration, 20s) linear infinite;
        will-change: transform;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      .group:hover .pause-on-hover {
        animation-play-state: paused;
      }

      /* Image Masking for Responsive Backgrounds */
      .mask-fade-right {
        mask-image: linear-gradient(to right, black 50%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 50%, transparent 100%);
      }
      .mask-fade-left {
        mask-image: linear-gradient(to left, black 60%, transparent 100%);
        -webkit-mask-image: linear-gradient(to left, black 60%, transparent 100%);
      }
      /* Mobile Mask: Fade out at bottom for text contrast if needed, or subtle fade */
      .mask-fade-mobile {
         mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
      }
      
      /* Print Styles */
      @media print {
        body { background: white !important; color: black !important; }
        .glass-panel, .glass-card-premium { 
          box-shadow: none !important; 
          border: 1px solid #ddd !important;
          background: white !important;
          backdrop-filter: none !important;
        }
        button, .fixed { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
  <body class="min-h-screen antialiased selection:bg-purple-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
